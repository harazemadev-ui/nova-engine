[project]
name = "nova-engine"
version = "0.2.1"
description = "Nova Engine - AI execution and module framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "groq",
    "google-genai",
    "xai-sdk",
    "redis",
    "openai",
    "SQLAlchemy>=2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
